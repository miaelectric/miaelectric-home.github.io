<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 일기 메모장</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b21;
        --text: #e6e8eb;
        --muted: #9aa3ad;
        --border: #2a2f37;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
    h1 { margin: 12px 0 4px; font-size: 24px; }
    .sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
    textarea {
      width: 100%;
      min-height: 60vh;
      padding: 16px;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .bar .status { margin-right: auto; color: var(--muted); font-size: 13px; }
    button {
      font: inherit;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">← 실습 자료 목록</a>
    <h1>📈 주식 일기</h1>
    <p class="sub">간단한 메모장입니다. 쓰는 즉시 이 브라우저에 자동 저장됩니다.</p>

    <textarea id="memo" placeholder="오늘의 매매 기록, 생각, 배운 점을 적어보세요."></textarea>

    <div class="bar">
      <span class="status" id="status">저장 대기</span>
      <button id="dateBtn">오늘 날짜 넣기</button>
      <button id="downloadBtn">파일로 저장</button>
      <button id="clearBtn">모두 지우기</button>
    </div>
  </div>

  <script>
    const KEY = 'stock-diary-memo';
    const memo = document.getElementById('memo');
    const status = document.getElementById('status');

    try { memo.value = localStorage.getItem(KEY) || ''; } catch (e) {}

    let saveTimer;
    function save() {
      try {
        localStorage.setItem(KEY, memo.value);
        status.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
      } catch (e) {
        status.textContent = '이 브라우저에서는 자동 저장이 안 됩니다. "파일로 저장"을 이용하세요.';
      }
    }
    memo.addEventListener('input', () => {
      status.textContent = '입력 중…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 400);
    });

    document.getElementById('dateBtn').addEventListener('click', () => {
      const d = new Date();
      const stamp = `[${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}]\n`;
      const prefix = memo.value && !memo.value.endsWith('\n') ? '\n\n' : (memo.value ? '\n' : '');
      memo.value += prefix + stamp;
      memo.focus();
      memo.selectionStart = memo.selectionEnd = memo.value.length;
      save();
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([memo.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '주식일기.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (memo.value && confirm('메모를 모두 지울까요? 되돌릴 수 없습니다.')) {
        memo.value = '';
        save();
      }
    });
  </script>
</body>
</html>
