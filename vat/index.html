<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부가세계산기</title>
  <style>
    :root { --bg: #f6f7f9; --text: #1f2328; --muted: #6b7280; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --text: #e6e8eb; --muted: #9aa3ad; --accent: #60a5fa; }
    }
    body { margin: 0; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    a.back { color: var(--accent); text-decoration: none; font-size: 14px; }
    h1 { margin: 12px 0 4px; font-size: 24px; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">← 실습 자료 목록</a>
    <h1>🧾 부가세계산기</h1>
    <p>준비 중입니다.</p>

    <!-- 여기에 내용을 작성하세요 -->

  </div>
</body>
</html>
